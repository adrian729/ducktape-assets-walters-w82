id: ape-gripping-leafy-stalk
title: Ape climbing a leafy stalk
description: A brown ape stands on its hind legs facing right and grips a red stalk with both hands. The stalk carries a red trefoil leaf and a white leaf at the top, a pink leaf at mid height and a rose-red leaf curling at its foot, with a small red bud at the hands of the ape. Dark outlines, white hatching on the fur; the background is transparent.
