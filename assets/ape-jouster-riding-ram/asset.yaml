id: ape-jouster-riding-ram
title: Ape jousting on a ram
description: A brown ape rides bareback on a leaping shaggy ram with curled gold horns, facing left. It levels a red lance with a three-pronged tip to the left and holds a pale shield charged with a black lion rampant. The ram's cream fleece is marked with dark curling strokes, and everything is drawn with a black outline. Transparent background.
