id: ape-riding-unicorn-with-hound
title: Ape riding a unicorn, bitten by a hound
description: A brown ape sits astride a grey, shaggy, long-necked mount running to the left and raises a gold sword over its head with both hands; a cream hound behind bites the mount on the rump, where red marks show. The Walters record calls the mount a unicorn; no horn is visible. Dark outlines over grey, tan and cream washes; the background is transparent.
