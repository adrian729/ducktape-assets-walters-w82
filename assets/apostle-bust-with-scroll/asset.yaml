id: apostle-bust-with-scroll
title: Haloed apostle with inscribed scroll
description: Bust of a grey-haired, bearded apostle with an orange-red halo, cut from the initial. He faces slightly to the right, wrapped in a grey-green mantle over an orange-red robe, and holds across his chest a pale scroll bearing a line of pseudo-inscription. Flecks of the gold ground remain along the halo and the right edge, and the right end of the scroll is ragged. Transparent background.
