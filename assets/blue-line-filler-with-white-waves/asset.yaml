id: blue-line-filler-with-white-waves
title: Blue line filler with two gold roundels
description: A long blue painted bar pointed at both ends, with two gold roundels at the left end, a white wavy line along the upper half, a row of short white hatch strokes and a long white rule along the lower half, and a curled white terminal at the right. The paint is grainy and the edge of the bar is uneven. Transparent background.
