id: crowned-bell-ringer-with-hammers
title: King David striking bells with two hammers
description: A crowned, bearded king in a blue mantle over a rose-brown tunic sits on a cream bench with green arcading and gold leaf finials, turned to the right, and swings two green hammers at four blue bells hung from an orange rod above him. Gold crown, worn gilding on the bells, dark outlines; the background is transparent.
