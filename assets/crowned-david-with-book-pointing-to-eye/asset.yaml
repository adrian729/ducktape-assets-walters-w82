description: A crowned, bearded King David in a blue robe over a grey-mauve mantle lined with green stands facing left, his right hand raised to point at his eye and his left hand holding a green book. An orange drapery with white dots hangs at the left and grey shoes show below. Gold crown, dark outlines; the background is transparent.
