id: falconer-with-hawk
title: Falconer with hawk above a vine
description: A standing man with curly hair, in a long grey-brown gown with a gold hood thrown back on his shoulders, turns his head to the left towards a grey long-tailed hawk with a red-brown head perched on his raised left hand. Beneath his feet a blue vine stem with orange and grey-green leaves curls downwards. The right edge of the gown is cut where the page was cropped. Transparent background.
