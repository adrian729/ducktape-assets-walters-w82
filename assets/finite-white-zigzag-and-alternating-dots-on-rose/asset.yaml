id: finite-white-zigzag-and-alternating-dots-on-rose
title: Rose line filler with white zigzag and dots
description: A short rose-brown painted bar with a white zigzag running its length, a white dot in each angle above and below, and a white rule inset along each edge, joined at the ends; a small red mark sits at the left end. Uneven edges and grainy paint. Transparent background.
