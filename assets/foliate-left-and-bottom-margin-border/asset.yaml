# descriptive: find it and understand it
id: foliate-left-and-bottom-margin-border
title: L-shaped margin border, left and bottom
description: An L-shaped bar border for the left and bottom margins of a page. A thin blue and gold spine runs down the left, with a cluster of folded blue leaves on a gold ground a third of the way down in which two small animals, one red and one rose, curl in roundels; at the top the stem bends right to a sprig of red and white leaves. Along the bottom a thin brown stem runs right with an orange forked leaf, a gold knot and a dark terminal, broken by gaps; the background is transparent.
type: corner
