id: foliate-left-and-top-margin-border
title: Blue and gold foliate margin border
description: An L-shaped margin border running down the left and across the top of the page. At the top-left a bar of blue and burnished gold with serrated gold edges knots into a loop of curling blue leaves and a small brown leaf; from it a thin stem bows down the whole left side and ends in a fork of three leaves in grey-blue, brown and orange, while along the top a slender stem ends in a gold roundel and a brown leaf. Gaps where the initial and figures overlapped it are left open. Transparent background.
