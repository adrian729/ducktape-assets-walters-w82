id: foliate-waves-and-gold-roundels-band
title: Blue and rose line filler with foliate wave and four gold roundels
description: A long painted bar, blue over its left two thirds and rose-brown over the right third, with a white waving stem carrying small trefoil leaf sprigs along its whole length and four gold roundels set in the blue part near the middle. Edged in dark paint and slightly tapered at the right. Transparent background.
