# descriptive: find it and understand it
id: god-blessing-bust-with-orb
title: God blessing from above, bust with orb
description: "The bust of God from the top of an initial: a youthful face in grey-cream wash with rose cheeks inside a red cruciform halo, in a grey robe with orange-brown lining. The left hand points to the left and the right arm cradles a green-banded orb at the right. The lower edge is cut straight where the frame of the initial covered the figure; the background is transparent."
