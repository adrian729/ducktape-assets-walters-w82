id: haloed-god-with-orb-pointing-from-clouds
title: God pointing from clouds with orb
description: "A haloed figure of God leans out of a bank of purple-brown and grey curled clouds edged with white, facing right: a youthful face in grey wash inside a red cruciform halo, a grey robe, a cross-marked orb held in the left hand and the right hand pointing to the right. The lower right is cut straight along an orange strip where the frame of the initial covered the figure; the background is transparent."
