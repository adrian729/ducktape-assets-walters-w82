id: hound-seizing-long-eared-animal
title: Hound biting a leaping deer-like beast
description: A cream hound with a red collar bites the rump of a grey-brown, long-eared beast leaping up to the right, its head turned forward and forelegs raised; the tail of the hound curls back at the left. The Walters record calls the quarry a unicorn, but no horn is visible. Dark outlines over cream and grey washes; the background is transparent.
