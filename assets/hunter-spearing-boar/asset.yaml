id: hunter-spearing-boar
title: Hunter spearing a boar
description: A bareheaded hunter with curly fair hair, in a red-orange tunic and green hose, strides to the right and drives a long spear into a grey boar lying on its back with its legs in the air. Red strokes of blood spurt above and below the wound. Black outlines, transparent background.
