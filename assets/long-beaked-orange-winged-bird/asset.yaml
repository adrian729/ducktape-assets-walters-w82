title: Long-beaked bird hybrid with human-faced tail
description: A grey-green bird-like creature faces left with a long open beak showing teeth, a long neck dotted with white, two orange feathered wings, one raised and one spread back, and orange legs; its tail ends in a bearded human face in profile looking right, trailing wavy flame-like wisps. Dark outlines over flat colour; the background is transparent.
