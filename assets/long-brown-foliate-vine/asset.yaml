# descriptive: find it and understand it
id: long-brown-foliate-vine
title: Tall brown vine bar with coloured leaves
description: "A tall vertical margin vine on a thin brown stem: a pointed brown leaf curls at the top over a brown bud, the stem runs down with small thorns, then carries a blue leaf and a green bud, a yellow-green leaf and grey-blue leaves lower down, and ends in a small gold knob. Painted interiors are opaque and the loops of the stem open; the background is transparent."
