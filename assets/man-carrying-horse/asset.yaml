title: Man carrying a horse on his shoulders
description: A curly-haired man in an orange tunic and grey hose strides to the right with bare feet apart, carrying a tan horse across his shoulders with both hands; the head of the horse hangs down at the left, its tail flies out at the right, and the man looks back toward its head. Dark outlines, flat colour; the background is transparent.
