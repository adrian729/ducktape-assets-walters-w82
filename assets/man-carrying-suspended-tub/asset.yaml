title: Striding man with grey bundle and green sprig
description: A bald man with a fringe of hair, in a grey tunic with orange lining and bare legs, strides to the left. His right arm hooks over a grey basin-shaped bundle hanging in front of him, orange lining showing beneath, and his left hand holds out a green sprig of leaves. Dark outlines, grainy cream and grey wash; the background is transparent.
