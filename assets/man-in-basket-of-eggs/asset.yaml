id: man-in-basket-of-eggs
title: Man in a basket of eggs
description: A man in a grey-brown hooded robe sits in a woven basket full of pale eggs and looks out towards the viewer, his right hand raised and holding thin red cords. The cords hang from a gold disc with a sketched face under a scalloped grey-blue cap, which floats above him at the left. Soft dark outlines and muted colours on a transparent background.
