id: merman-with-spoon
title: Merman with a spoon
description: A merman swims to the right. His bare-headed human upper body wears an orange tunic and his long scaled grey-green fish tail trails away to the left; both arms reach forward holding a long-handled spoon with a round bowl. An orange-edged stroke crossing the bowl, the bill of the stork he feeds on the page, is cut at both ends, and the top of his head is clipped. Transparent background.
