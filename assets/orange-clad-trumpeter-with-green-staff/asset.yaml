title: Trumpeter in a pointed blue hat with green staff
description: A standing young man faces left and blows a short gold horn held in his right hand. He wears a pointed blue hat with white dots, an orange tunic under a rose-brown shoulder cape, cream hose and bare feet, and carries a green leafy staff over his left shoulder. Dark outlines, soft colour; the background is transparent.
