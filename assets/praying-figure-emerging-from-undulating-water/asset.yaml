id: praying-figure-emerging-from-undulating-water
title: David praying in the water
description: "A figure rises from a half-disc of green water: the head at the left, tipped back and looking up with closed eyes, the hands joined in prayer above the surface, and the body showing through dark wavy lines of water. The flat top edge of the water is where the frame of the initial met it; the background is transparent."
