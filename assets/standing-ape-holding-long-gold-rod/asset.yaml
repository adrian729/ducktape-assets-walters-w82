id: standing-ape-holding-long-gold-rod
title: Ape raising a gold rod
description: A grey-green ape stands upright in profile facing left with its head tilted back, gripping with both raised hands a long gold rod that widens to a flat head at the top right. Its legs are long and bent. The top of the rod and the toes of the rear foot are cut where the margin border and the page crop overlapped them. Dark outline, transparent background.
