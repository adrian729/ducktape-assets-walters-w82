id: three-roundels-and-white-zigzag-band
title: Blue and rose line filler with three gold roundels and zigzag
description: A long painted bar, blue over the left half with three gold roundels at its end and rose-brown over the right half, with a fine white wavy zigzag running the whole length between a white rule inset along each edge. The bar tapers slightly to the right and its ends are uneven. Transparent background.
