# descriptive: find it and understand it
id: white-curled-stroke-pattern-on-blue
title: White wave on blue, repeat tile with corner
description: "One cycle of a painted bar border: a white S-curling wave between two thin white rules on a deep blue ground, the pattern continuing across the left and right edges. The top and bottom edges are the ragged painted edges of the band itself, with a dark rim, and everything beyond them is transparent. A matching top-left corner component turns the rules around the angle with one curl inside."
type: border
categories:
  - geometric
subjects:
  - wave
  - curl
  - rule
colors:
  - blue
  - white
  - black
facing: none
composition: repeat-tile

