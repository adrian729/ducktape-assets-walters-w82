    master: corner-top-left.png
    description: "Top-left corner, square at the thickness of the band, composed from the same painted band: the rules turn the angle and one curl sits inside, and its right edge continues into the tile. A modern derivation, not a motif of the page."
usage_notes:
  - Repeat along x for a horizontal band, or use the generated rotated tile for a vertical one; the cycle is shorter than the band is thick, so it is a one-motif tile rather than a strip.
  - The frame atlas composes the tile with the top-left corner mirrored to the other three corners; use it with border-image and round fitting.
