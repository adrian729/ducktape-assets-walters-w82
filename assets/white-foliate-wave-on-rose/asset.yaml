id: white-foliate-wave-on-rose
title: White foliate wave on rose, repeat tile
description: One cycle of a rose-brown painted band with a white waving stem that throws a trefoil leaf sprig into each bend, above and below, and a dark painted edge along the bottom. The pattern continues across the left and right edges; transparent beyond the band.
