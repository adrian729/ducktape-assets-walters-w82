id: white-wave-and-alternating-dots-on-blue
title: White wave with dots on blue, repeat tile
description: One cycle of a blue painted band, a white wave with a white dot in the bend above and in the bend below, between a white rule inset along each edge and a dark painted edge beyond. The pattern continues across the left and right edges; transparent beyond the band.
